<main class="container main-grid" id="mainContent">

  <!-- Left / Lead column -->
  <section class="lead-column">

    <div id="leadNews"></div>

    <div class="small-news-grid" id="smallNews"></div>

  </section>


  <!-- Middle -->
  <section class="sports-column">

    <div class="section-title">
      <span id="sectionCategory">
        খেলাধুলা
      </span>

      <a href="sports.html">
        সবগুলো দেখুন →
      </a>
    </div>

    <div
      class="sports-grid"
      id="sportsNews">
    </div>

  </section>


  <!-- Right Sidebar -->
  <aside class="sidebar">

    <div class="sidebar-box latest">

      <div class="sidebar-title">
        সর্বশেষ সংবাদ
      </div>

      <ol id="latestNews">
      </ol>

    </div>


    <div class="sidebar-box popular">

      <div class="sidebar-title orange">
        জনপ্রিয় সংবাদ
      </div>

      <ol id="popularNews">
      </ol>

    </div>


    <div class="newsletter">

      <h3>
        নিউজলেটার সাবস্ক্রাইব করুন
      </h3>

      <p>
        প্রতিদিনের সব খবর পেতে ইমেইল সাবস্ক্রাইব করুন
      </p>

      <form id="newsletterForm">

        <input
          type="email"
          id="emailInput"
          placeholder="আপনার ইমেইল লিখুন"
          required
        >

        <button type="submit">
          সাবস্ক্রাইব করুন
        </button>

      </form>

      <div id="newsletterMessage"></div>

    </div>

  </aside>

</main>
